# The Insights screen in its empty state.
appId: studio.peacockery.closeyourtab
name: Insights Screen - UI consistency check
tags:
  - ui
  - navigation
---
- runFlow: subflows/launch.yaml
- tapOn: "Insights"
- extendedWaitUntil:
    visible: "This Month"
    timeout: 10000
- assertVisible: "Avg Tab"
- assertVisible: "Total Tabs"
- assertVisible: "History"
- assertVisible: "No history yet\\. Go out and have fun!"
- takeScreenshot: insights_screen
