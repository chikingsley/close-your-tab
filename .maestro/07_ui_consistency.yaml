# Screens keep their core elements while moving between tabs.
appId: studio.peacockery.closeyourtab
name: UI Consistency - Visual regression baseline
tags:
  - ui
  - smoke
---
- runFlow: subflows/launch.yaml
- assertVisible: "All"
- assertVisible: "Bars"
- assertVisible: "Restaurants"
- assertVisible: "Favorites"
- takeScreenshot: ui_map_screen
- tapOn: "Insights"
- extendedWaitUntil:
    visible: "This Month"
    timeout: 10000
- assertVisible: "Avg Tab"
- assertVisible: "Total Tabs"
- takeScreenshot: ui_insights_screen
- assertVisible: "Map"
- assertVisible: "Insights"
- tapOn: "Map"
- extendedWaitUntil:
    visible: "Bars"
    timeout: 10000
- takeScreenshot: ui_final_state
