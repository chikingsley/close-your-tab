# Closing a tab with a final amount and tip records it in history.
appId: studio.peacockery.closeyourtab
name: Tab Flow - Close tab with tip
tags:
  - tab-flow
  - ui
---
- runFlow: subflows/launch.yaml
- runFlow: subflows/open_tab.yaml
- tapOn: "Close Tab"
- extendedWaitUntil:
    visible: "Close Your Tab"
    timeout: 5000
- assertVisible: "Final Amount \\(\\$\\)"
- assertVisible: "Tip"
- assertVisible: "15%"
- assertVisible: "18%"
- assertVisible: "20%"
- assertVisible: "25%"
- tapOn:
    id: "final-amount-input"
- inputText: "45.00"
- tapOn: "20%"
- assertVisible: "9\\.00"
- tapOn: "Close Tab"
- extendedWaitUntil:
    notVisible: "RUNNING"
    timeout: 5000
- tapOn: "Insights"
- extendedWaitUntil:
    visible: "E2E Test Bar"
    timeout: 10000
- assertVisible: "\\$54\\.00"
