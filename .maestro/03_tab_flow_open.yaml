# Opening a tab at a venue shows the running tab sheet.
appId: studio.peacockery.closeyourtab
name: Tab Flow - Open a new tab
tags:
  - tab-flow
  - ui
---
- runFlow: subflows/launch.yaml
- runFlow: subflows/open_tab.yaml
- assertVisible: "\\$0\\.00"
- assertVisible: "Add Drink"
- assertVisible: "Close Tab"
