# Opens a tab at the fixture venue from an e2e build (EXPO_PUBLIC_E2E=1).
# Map markers only appear to accessibility as a generic "Map pin", and the
# centre of the chip is covered by the location dot, so tap its "Open" pill.
# The fixture venue is placed at the map centre, which fixes this position.
# The assertions at the end fail the flow if no tab opened.
appId: studio.peacockery.closeyourtab
---
- repeat:
    while:
      notVisible: "RUNNING"
    times: 5
    commands:
      - tapOn:
          point: "62%,49%"
- extendedWaitUntil:
    visible: "RUNNING"
    timeout: 5000
- assertVisible: "E2E Test Bar"
