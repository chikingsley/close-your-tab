# Opens a tab at the fixture venue from an e2e build (EXPO_PUBLIC_E2E=1).
# The marker sits at the map centre. Its label is not always exposed to
# accessibility, so fall back to tapping the marker's position. Whichever path
# runs, the assertions at the end fail the flow if no tab opened.
appId: studio.peacockery.closeyourtab
---
- repeat:
    while:
      notVisible: "RUNNING"
    times: 6
    commands:
      - runFlow:
          when:
            visible:
              id: "venue-marker"
          commands:
            - tapOn:
                id: "venue-marker"
      - runFlow:
          when:
            notVisible: "RUNNING"
          commands:
            - tapOn:
                point: "50%,47%"
      - runFlow:
          when:
            notVisible: "RUNNING"
          commands:
            - tapOn:
                point: "50%,43%"
- extendedWaitUntil:
    visible: "RUNNING"
    timeout: 5000
- assertVisible: "E2E Test Bar"
