# Adding quick items and a custom item to an open tab.
appId: studio.peacockery.closeyourtab
name: Tab Flow - Add items to tab
tags:
  - tab-flow
  - ui
---
- runFlow: subflows/launch.yaml
- runFlow: subflows/open_tab.yaml
- tapOn: "Add Drink"
- extendedWaitUntil:
    visible: "QUICK ADD"
    timeout: 5000
- assertVisible: "No items yet"
- tapOn: "Beer"
- extendedWaitUntil:
    visible: "YOUR TAB \\(1 items\\)"
    timeout: 5000
- tapOn: "Wine"
- extendedWaitUntil:
    visible: "YOUR TAB \\(2 items\\)"
    timeout: 5000
- tapOn: "Food"
- extendedWaitUntil:
    visible: "YOUR TAB \\(3 items\\)"
    timeout: 5000
- tapOn: "Custom"
- extendedWaitUntil:
    visible: "Item name..."
    timeout: 5000
- inputText: "Nachos"
- tapOn: "Add"
- extendedWaitUntil:
    visible: "YOUR TAB \\(4 items\\)"
    timeout: 5000
- assertVisible: "Nachos"
