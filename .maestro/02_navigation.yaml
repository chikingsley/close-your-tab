# Tab navigation and the settings screen.
appId: studio.peacockery.closeyourtab
name: Navigation - Tab navigation and screen transitions
tags:
  - navigation
  - ui
---
- runFlow: subflows/launch.yaml
- tapOn: "Insights"
- extendedWaitUntil:
    visible: "This Month"
    timeout: 10000
- assertVisible: "Avg Tab"
- assertVisible: "Total Tabs"
- tapOn:
    id: "settings-button"
- extendedWaitUntil:
    visible: "Detection Radius"
    timeout: 10000
- assertVisible: "Quiet Hours"
