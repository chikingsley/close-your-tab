name: Tests

on:
  push:
    branches: [main, claude/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4
  EAS_VERSION: 27.4.1
  MAESTRO_VERSION: 2.12.1
  NODE_VERSION: 26

jobs:
  unit-tests:
    name: Unit Tests (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun test

  # E2E runs only when started by hand from the Actions tab. It takes about 50
  # minutes on a macOS runner and has not passed yet, so it does not run on push.
  e2e-preflight:
    name: E2E Preflight (credentials)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: unit-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # whoami prints the account email, and logs on this repo are public.
        run: npx --yes "eas-cli@$EAS_VERSION" whoami > /dev/null

  e2e-tests:
    name: E2E Tests (Maestro)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    needs: e2e-preflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          eas-version: ${{ env.EAS_VERSION }}
          packager: bun

      # EXPO_TOKEN is set here rather than through the action token input, because
      # that input runs whoami, which prints the account email to public logs.
      - name: Build iOS Simulator app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --profile e2e --platform ios --local --output ./app-build.tar.gz --non-interactive

      - name: Extract app
        run: |
          tar -xzf app-build.tar.gz
          mv ./*.app close-your-tab.app

      - name: Install Maestro
        env:
          MAESTRO_VERSION: ${{ env.MAESTRO_VERSION }}
        run: |
          curl -fsSL --retry 3 "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS Simulator and install app
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS"))]
            | sort_by(.key) | last | .value
            | map(select(.name | startswith("iPhone"))) | first | .udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          xcrun simctl location "$udid" set 33.4942,-111.9261
          xcrun simctl install "$udid" close-your-tab.app
          echo "DEVICE_UDID=$udid" >> "$GITHUB_ENV"

      - name: Run Maestro tests
        run: |
          maestro --device "$DEVICE_UDID" test \
            --format junit --output maestro-report.xml \
            --test-output-dir maestro-output \
            .maestro/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            maestro-output/
          if-no-files-found: ignore
          retention-days: 7
